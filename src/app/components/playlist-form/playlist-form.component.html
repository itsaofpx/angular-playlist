<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>
      <mat-icon>queue_music</mat-icon>
      Create New Playlist
    </mat-card-title>
    <mat-card-subtitle>Organize your music collection</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <form
      [formGroup]="playlistForm"
      (ngSubmit)="onSubmit()"
      class="playlist-form"
    >
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Playlist Name</mat-label>
        <input
          matInput
          formControlName="name"
          required
          placeholder="Enter Playlist"
          autocomplete="off"
        />
        <mat-icon matSuffix>queue_music</mat-icon>
        <mat-error
          *ngIf="
            playlistForm.get('name')?.touched &&
            playlistForm.get('name')?.hasError('required')
          "
        >
          Playlist name is required
        </mat-error>
        <mat-error
          *ngIf="
            playlistForm.get('name')?.touched &&
            playlistForm.get('name')?.hasError('minlength')
          "
        >
          Playlist name must be at least 1 character long
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description (Optional)</mat-label>
        <textarea
          matInput
          formControlName="description"
          rows="3"
          placeholder="Describe your playlist..."
          autocomplete="off"
        ></textarea>
        <mat-icon matSuffix>description</mat-icon>
      </mat-form-field>

      <div class="form-actions">
        <button
          mat-button
          type="button"
          (click)="onReset()"
          [disabled]="playlistForm.pristine || isLoading"
          class="reset-btn"
        >
          <mat-icon>clear</mat-icon>
          Clear
        </button>
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="isSubmitDisabled()"
          class="submit-btn"
        >
          <mat-spinner
            diameter="20"
            *ngIf="isLoading"
            class="loading-spinner"
          ></mat-spinner>
          <mat-icon *ngIf="!isLoading">add</mat-icon>
          {{ isLoading ? "Creating..." : "Create Playlist" }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
