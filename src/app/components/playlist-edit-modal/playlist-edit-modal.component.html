<div
  class="modal-overlay"
  *ngIf="isVisible"
  (click)="onOverlayClick($event)"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modal-title"
>
  <div class="modal-container" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="modal-header">
      <div class="header-content">
        <mat-icon>edit</mat-icon>
        <h2 id="modal-title">Edit Playlist</h2>
      </div>
      <button
        mat-icon-button
        (click)="closeModal()"
        class="close-btn"
        type="button"
        aria-label="Close modal"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body">
      <form #playlistForm="ngForm" (ngSubmit)="onSubmit(playlistForm)">
        <!-- Playlist Name -->
        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Playlist Name</mat-label>
          <input
            matInput
            [(ngModel)]="formData.name"
            name="name"
            #nameField="ngModel"
            required
            maxlength="100"
            placeholder="Enter playlist name"
            autocomplete="off"
          />
          <mat-icon matPrefix>queue_music</mat-icon>
          <mat-error *ngIf="nameField.invalid && nameField.touched">
            <span *ngIf="nameField.errors?.['required']">
              Playlist name is required
            </span>
          </mat-error>
        </mat-form-field>

        <!-- Playlist Description -->
        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Description (Optional)</mat-label>
          <textarea
            matInput
            [(ngModel)]="formData.description"
            name="description"
            #descriptionField="ngModel"
            maxlength="500"
            rows="3"
            placeholder="Enter playlist description"
            autocomplete="off"
          ></textarea>
          <mat-icon matPrefix>description</mat-icon>
          <mat-hint align="end">
            {{ formData.description!.length || 0 }}/500
          </mat-hint>
        </mat-form-field>

        <!-- Form Actions -->
        <div class="form-actions">
          <button
            mat-button
            type="button"
            (click)="closeModal()"
            class="cancel-btn"
            [disabled]="isSubmitting"
          >
            Cancel
          </button>
          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="!playlistForm.valid || isSubmitting"
            class="save-btn"
          >
            <mat-icon *ngIf="isSubmitting">hourglass_empty</mat-icon>
            <mat-icon *ngIf="!isSubmitting">save</mat-icon>
            {{ isSubmitting ? "Saving..." : "Save Changes" }}
          </button>
        </div>
      </form>
    </div>

    <!-- Playlist Info -->
    <div class="playlist-info" *ngIf="playlist">
      <div class="info-item">
        <mat-icon>music_note</mat-icon>
        <span
          >{{ getSongCount() }} song{{ getSongCount() !== 1 ? "s" : "" }}</span
        >
      </div>
    </div>
  </div>
</div>
