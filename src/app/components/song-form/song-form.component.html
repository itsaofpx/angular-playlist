<div class="song-form">
  <div class="form-header">
    <h3>Add New Song</h3>
  </div>

  <form [formGroup]="songForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Title</label>
      <input
        id="title"
        type="text"
        formControlName="title"
        placeholder="Enter song title"
        [class.error]="
          songForm.get('title')?.invalid && songForm.get('title')?.touched
        "
      />
      <div
        class="error-message"
        *ngIf="
          songForm.get('title')?.hasError('required') &&
          songForm.get('title')?.touched
        "
      >
        Title is required
      </div>
    </div>

    <div class="form-group">
      <label for="artist">Artist</label>
      <input
        id="artist"
        type="text"
        formControlName="artist"
        placeholder="Enter artist name"
        [class.error]="
          songForm.get('artist')?.invalid && songForm.get('artist')?.touched
        "
      />
      <div
        class="error-message"
        *ngIf="
          songForm.get('artist')?.hasError('required') &&
          songForm.get('artist')?.touched
        "
      >
        Artist is required
      </div>
    </div>

    <div class="form-actions">
      <button
        type="button"
        class="btn btn-secondary"
        (click)="onClear()"
        [disabled]="isLoading"
      >
        Clear
      </button>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="isAddButtonDisabled"
      >
        <span *ngIf="isLoading" class="loading-text">Adding...</span>
        <span *ngIf="!isLoading">Add Song</span>
      </button>
    </div>
  </form>
</div>
