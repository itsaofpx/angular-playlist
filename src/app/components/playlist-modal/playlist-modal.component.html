<div class="playlist-modal-overlay" (click)="closeModal()">
  <div class="playlist-modal" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="playlist-modal-header">
      <div class="header-info">
        <mat-icon>queue_music</mat-icon>
        <div class="playlist-title">
          <h3>{{ playlist?.name }}</h3>
          <p>{{ songs.length }} song{{ songs.length !== 1 ? "s" : "" }}</p>
        </div>
      </div>
      <button mat-icon-button class="close-button" (click)="closeModal()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Modal Content -->
    <div class="playlist-modal-content">
      <div class="modal-songs-list">
        <div class="modal-songs-header">
          <h4>Songs in this Playlist</h4>
          <button
            mat-raised-button
            color="primary"
            class="add-song-btn"
            (click)="openAddSongsDialog()"
            [disabled]="availableSongs.length === 0"
          >
            <mat-icon>add</mat-icon>
            Add Songs
          </button>
        </div>

        <!-- Loading State -->
        <div *ngIf="isLoading" class="loading-state">
          <mat-spinner diameter="40"></mat-spinner>
          <p>Loading songs...</p>
        </div>

        <!-- Songs List -->
        <div *ngIf="!isLoading && songs.length > 0">
          <div
            class="modal-song-item"
            *ngFor="let song of songs; let i = index"
          >
            <div class="modal-song-info">
              <div class="modal-song-number">{{ i + 1 }}</div>
              <div class="modal-song-details">
                <h6>{{ song.title }}</h6>
                <p>{{ song.artist }}</p>
              </div>
            </div>
            <div class="modal-song-actions">
              <button
                mat-icon-button
                color="warn"
                (click)="removeSong(song.id)"
                matTooltip="Remove from playlist"
                [disabled]="isRemovingSong && removingSongId === song.id"
              >
                <mat-spinner
                  *ngIf="isRemovingSong && removingSongId === song.id"
                  diameter="20"
                ></mat-spinner>
                <mat-icon
                  *ngIf="!(isRemovingSong && removingSongId === song.id)"
                  >remove</mat-icon
                >
              </button>
            </div>
          </div>
        </div>

        <!-- Empty State -->
        <div class="modal-empty-state" *ngIf="!isLoading && songs.length === 0">
          <mat-icon>music_note</mat-icon>
          <h4>No songs in this playlist</h4>
          <p>Add some songs to get started</p>
          <button
            mat-raised-button
            color="primary"
            (click)="openAddSongsDialog()"
            [disabled]="availableSongs.length === 0"
          >
            Add Your First Song
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Actions -->
    <div class="playlist-modal-actions">
      <button
        mat-raised-button
        color="warn"
        (click)="deletePlaylist()"
        style="margin-right: auto"
      >
        <mat-icon>delete</mat-icon>
        Delete Playlist
      </button>
      <button mat-button (click)="closeModal()">Close</button>
    </div>
  </div>
</div>

<!-- Add Songs Dialog -->
<app-add-songs-dialog
  *ngIf="showAddSongsDialog"
  [playlist]="playlist"
  [availableSongs]="availableSongs"
  (closed)="closeAddSongsDialog()"
  (songAdded)="onSongAdded($event)"
>
</app-add-songs-dialog>
